
services:
  noxia:
    build: .
    image: noxia
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      GTK_A11Y: none
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    entrypoint: ["dbus-run-session", "--"]
    command: ["python3", "/app/main.py"]
